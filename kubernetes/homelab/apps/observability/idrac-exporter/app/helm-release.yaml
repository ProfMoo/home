---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app idrac-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      idrac-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          idrac-exporter:
            image:
              repository: ghcr.io/mrlhansen/idrac_exporter
              tag: 2.6.2@sha256:1aceff5464db3a1a85e94303fb43e0e231b1f3bef2adfce06938f9886a184b51
            command:
              - /app/bin/idrac_exporter
              - --config=/config/config.yaml
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
      priorityClassName: high-priority
    service:
      app:
        controller: *app
        ports:
          metrics:
            port: 9348
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - interval: 2m
            path: /metrics
            port: metrics
            scheme: http
            scrapeTimeout: 60s
            params:
              target: ["node.2.internal.drmoo.io"]
            relabelings: &relabelings
              # NOTE: Set 'instance' to the iDRAC target instead of the exporter pod IP.
              - sourceLabels: [__param_target]
                targetLabel: instance
          - interval: 2m
            path: /metrics
            port: metrics
            scheme: http
            scrapeTimeout: 60s
            params:
              target: ["node.3.internal.drmoo.io"]
            relabelings: *relabelings
          - interval: 2m
            path: /metrics
            port: metrics
            scheme: http
            scrapeTimeout: 60s
            params:
              target: ["node.1.internal.drmoo.io"]
            relabelings: *relabelings
    persistence:
      config:
        type: configMap
        name: idrac-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
